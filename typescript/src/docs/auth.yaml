# Documentación Swagger (OpenAPI) de /api/health y /api/auth

paths:
  /api/health:
    get:
      summary: Comprobar que la API está viva
      tags:
        - Auth
      security: []
      responses:
        "200":
          description: La API responde
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: API en funcionamiento
  /api/auth/register:
    post:
      summary: Registrar un usuario
      description: Siempre crea usuarios con rol "user". Si se envía "role", se ignora.
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Usuario creado (sin contraseña)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/auth/login:
    post:
      summary: Iniciar sesión
      description: Devuelve el token en el body (para enviarlo en la cabecera Authorization) y además lo guarda en una cookie httpOnly "token", que el navegador envía sola.
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login correcto. Devuelve el token y el usuario
          headers:
            Set-Cookie:
              description: Cookie httpOnly con el token
              schema:
                type: string
                example: token=eyJhbGciOi...; Path=/; HttpOnly; SameSite=Strict
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                      user:
                        $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Credenciales incorrectas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/auth/logout:
    post:
      summary: Cerrar sesión (borra la cookie del token)
      description: Hace falta porque el frontend no puede borrar una cookie httpOnly. Con el token en la cabecera, basta con que el frontend lo olvide.
      tags:
        - Auth
      security: []
      responses:
        "200":
          description: Sesión cerrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Sesión cerrada
  /api/auth/me:
    get:
      summary: Datos del usuario que ha hecho login
      tags:
        - Auth
      responses:
        "200":
          description: El usuario del token
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
